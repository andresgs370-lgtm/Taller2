<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">

      <div class="card tarjeta-busqueda shadow-sm">
        <div class="card-header encabezado-busqueda text-center">
          <h2 class="mb-0">Buscar país</h2>
        </div>

        <div class="card-body p-4">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Escribe el nombre del país...">
            <button class="btn btn-buscar" type="button">Buscar</button>
            <button class="btn btn-outline-secondary" type="button">Limpiar</button>
          </div>

          <div class="alert alert-warning mt-4 mb-0">
            No se encontró ningún país con ese nombre.
          </div>

          <div class="resultado mt-4">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div>
                <h3 class="mb-0 nombre-pais">Nombre del país</h3>
                <small class="text-muted">Continente</small>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-md-6"><span class="etiqueta">Capital</span><div>—</div></div>
              <div class="col-md-6"><span class="etiqueta">Idioma oficial</span><div>—</div></div>
              <div class="col-md-4"><span class="etiqueta">Población</span><div>—</div></div>
              <div class="col-md-4"><span class="etiqueta">Área (km²)</span><div>—</div></div>
              <div class="col-md-4"><span class="etiqueta">Moneda</span><div>—</div></div>
              <div class="col-12"><span class="etiqueta">Descripción</span><div>—</div></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
